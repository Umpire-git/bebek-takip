<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BabyAI Pro - Klinik Takip</title>
    
    <!-- iOS PWA Meta Etiketleri -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BabyAI">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --baby-blue: #e0f2fe;
            --baby-indigo: #6366f1;
            --soft-gray: #f8fafc;
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #000; /* iOS çentik uyumu için */
            overscroll-behavior-y: contain;
        }
        .app-container {
            background-color: var(--soft-gray);
            min-height: 100vh;
            max-width: 450px;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .arc-container { position: relative; width: 100%; height: 180px; overflow: hidden; }
        .tab-content { display: none; transition: all 0.3s ease; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease-out; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { display: none; }
        
        .action-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .action-btn:active { transform: scale(0.92); }
    </style>
</head>
<body>

    <div class="app-container flex flex-col">
        
        <!-- ÜST PANEL (Sticky Header) -->
        <header class="sticky top-0 z-50 glass-card px-6 pt-12 pb-4 border-b border-slate-200/50">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-gradient-to-tr from-indigo-500 to-blue-400 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-200">
                        <i class="fa-solid fa-baby text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-slate-900 tracking-tight">Ali Kuzey</h1>
                        <p id="babyAgeText" class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest">Yükleniyor...</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="switchTab('ai')" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 action-btn"><i class="fa-solid fa-sparkles text-sm"></i></button>
                </div>
            </div>
        </header>

        <!-- ATAK HAFTASI BANDI -->
        <div id="wonderWeekAlert" class="hidden animate-pulse bg-gradient-to-r from-rose-500 to-orange-400 p-3 text-center">
            <p class="text-white text-[10px] font-black uppercase tracking-widest"><i class="fa-solid fa-bolt mr-2"></i> Biyolojik Gelişim Sıçraması (Atak Haftası)</p>
        </div>

        <main class="flex-1 pb-32">
            <!-- PANEL SEKMESİ -->
            <div id="dailyTab" class="tab-content active px-6 pt-6">
                <!-- ARC GÖRSELLEŞTİRME -->
                <div class="bg-white rounded-[2.5rem] p-6 shadow-sm border border-slate-100 mb-6">
                    <div class="arc-container" id="arcContainer">
                        <svg viewBox="0 0 300 150" class="w-full h-full">
                            <path d="M 40,140 A 110,110 0 0,1 260,140" fill="none" stroke="#f1f5f9" stroke-width="12" stroke-linecap="round" />
                            <path id="arcProgress" d="M 40,140 A 110,110 0 0,1 260,140" fill="none" stroke="url(#grad1)" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 1000" />
                            <defs>
                                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                        </svg>
                        <div id="arcPoints" class="absolute inset-0"></div>
                        <div class="absolute inset-0 flex flex-col items-center justify-center pt-8">
                            <p id="mainTimerLabel" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Durum</p>
                            <h2 id="mainTimerValue" class="text-4xl font-black text-slate-800 tracking-tighter">--:--</h2>
                        </div>
                    </div>

                    <!-- HIZLI AKSİYONLAR -->
                    <div class="grid grid-cols-3 gap-4 mt-4">
                        <button onclick="toggleSleep()" class="flex flex-col items-center gap-2">
                            <div id="sleepBtnIconContainer" class="w-16 h-16 rounded-3xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-2xl action-btn border border-indigo-100">
                                <i id="sleepBtnIcon" class="fa-solid fa-moon"></i>
                            </div>
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Uyku</span>
                        </button>
                        <button onclick="openModal('feedingModal')" class="flex flex-col items-center gap-2">
                            <div class="w-16 h-16 rounded-3xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl action-btn border border-emerald-100">
                                <i class="fa-solid fa-bottle-droplet"></i>
                            </div>
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Beslenme</span>
                        </button>
                        <button onclick="openModal('diaperModal')" class="flex flex-col items-center gap-2">
                            <div class="w-16 h-16 rounded-3xl bg-amber-50 text-amber-600 flex items-center justify-center text-2xl action-btn border border-amber-100">
                                <i class="fa-solid fa-poop"></i>
                            </div>
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Bez</span>
                        </button>
                    </div>
                </div>

                <!-- SON KAYITLAR -->
                <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 px-2">Aktivite Geçmişi</h3>
                <div id="logList" class="space-y-3"></div>
            </div>

            <!-- ANALİZ SEKMESİ (AI) -->
            <div id="aiTab" class="tab-content px-6 pt-6">
                <div class="bg-indigo-600 rounded-3xl p-6 text-white mb-6 shadow-xl shadow-indigo-100">
                    <h3 class="text-lg font-bold mb-2">BabyAI Klinik Analiz</h3>
                    <p class="text-indigo-100 text-xs leading-relaxed opacity-90">Verileriniz ve pediyatrik algoritmalar birleştirilerek analiz yapılır. Tıbbi teşhis değildir.</p>
                </div>
                <div id="chatBox" class="space-y-4 mb-20"></div>
            </div>
            
            <!-- SAĞLIK SEKMESİ -->
            <div id="infoTab" class="tab-content px-6 pt-6">
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                    <h3 class="font-black text-slate-800 mb-4">Aşı Takvimi</h3>
                    <div id="vaccineList" class="space-y-4"></div>
                </div>
            </div>
        </main>

        <!-- ALT NAVİGASYON -->
        <nav class="fixed bottom-6 left-6 right-6 h-20 glass-card rounded-[2rem] border border-white shadow-2xl flex justify-around items-center z-50 px-4">
            <button onclick="switchTab('daily')" class="nav-btn text-indigo-600" data-target="daily">
                <i class="fa-solid fa-house-chimney text-xl"></i>
            </button>
            <button onclick="switchTab('info')" class="nav-btn text-slate-400" data-target="info">
                <i class="fa-solid fa-heart-pulse text-xl"></i>
            </button>
            <button onclick="switchTab('ai')" class="nav-btn text-slate-400" data-target="ai">
                <i class="fa-solid fa-wand-magic-sparkles text-xl"></i>
            </button>
        </nav>

        <!-- MODALLER (Aynı Mantık, Modern Tasarım) -->
        <div id="feedingModal" class="hidden fixed inset-0 z-[100] bg-slate-900/40 backdrop-blur-md flex items-end">
            <div class="w-full bg-white rounded-t-[3rem] p-8 animate-slide-up">
                <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-8"></div>
                <h3 class="text-2xl font-black text-slate-800 mb-6">Beslenme Kaydı</h3>
                <div class="space-y-4">
                    <button onclick="startNursingTimer()" class="w-full py-5 bg-emerald-500 text-white rounded-2xl font-bold shadow-lg shadow-emerald-100">Emzirmeyi Başlat</button>
                    <div class="flex gap-3">
                        <input id="formulaAmount" type="number" placeholder="Mama (cc)" class="flex-1 p-5 bg-slate-50 border-0 rounded-2xl font-bold outline-none ring-2 ring-transparent focus:ring-indigo-500 transition-all">
                        <button onclick="saveFormula()" class="px-8 bg-slate-900 text-white font-bold rounded-2xl">Kaydet</button>
                    </div>
                    <button onclick="closeModal('feedingModal')" class="w-full py-4 text-slate-400 font-bold">Vazgeç</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- CONFIG ---
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxus3MEkOxGKzKUYl-DQRLXtHzLi38BtO_8Fso-tKPUqcQ-yfv7H6QCSMSQ6p9xTvP8/exec"; 
        const BIRTH_DATE = "2026-04-17";

        let state = {
            logs: JSON.parse(localStorage.getItem('baby_logs')) || [],
            isSleeping: false,
            currentTab: 'daily'
        };

        // --- CORE FUNCTIONS ---
        function init() {
            renderLogs();
            updateStats();
            setInterval(updateStats, 10000); // 10 saniyede bir güncelle
            calculateWonderWeeks();
        }

        function updateStats() {
            // Yaş hesaplama
            const diff = new Date() - new Date(BIRTH_DATE);
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('babyAgeText').innerText = `${days} Günlük • ${Math.floor(days/7)}. Hafta`;
            
            // Son uykuyu kontrol et
            const lastSleep = state.logs.filter(l => l.type === 'sleep').pop();
            if (lastSleep && lastSleep.title.includes('Uyudu')) {
                state.isSleeping = true;
                updateTimer(lastSleep.timestamp, "Uykuda");
            } else if (lastSleep) {
                state.isSleeping = false;
                updateTimer(lastSleep.timestamp, "Uyanık");
            }
        }

        function updateTimer(ts, label) {
            const diff = Math.floor((Date.now() - ts) / 60000);
            const h = Math.floor(diff / 60);
            const m = diff % 60;
            document.getElementById('mainTimerValue').innerText = h > 0 ? `${h}s ${m}d` : `${m}dk`;
            document.getElementById('mainTimerLabel').innerText = label;
            
            // UI Güncelleme
            const icon = document.getElementById('sleepBtnIcon');
            const container = document.getElementById('sleepBtnIconContainer');
            if (state.isSleeping) {
                icon.className = "fa-solid fa-sun";
                container.className = "w-16 h-16 rounded-3xl bg-amber-50 text-amber-600 flex items-center justify-center text-2xl action-btn border border-amber-100 animate-pulse";
            } else {
                icon.className = "fa-solid fa-moon";
                container.className = "w-16 h-16 rounded-3xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-2xl action-btn border border-indigo-100";
            }
        }

        async function saveLog(type, title) {
            const log = {
                id: Date.now().toString(),
                timestamp: Date.now(),
                type,
                title,
                time: new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'})
            };
            
            state.logs.push(log);
            localStorage.setItem('baby_logs', JSON.stringify(state.logs));
            renderLogs();
            updateStats();
            
            // Arka plan senkronizasyonu
            const formData = new FormData();
            formData.append('action', 'save_log');
            formData.append('id', log.id);
            formData.append('type', type);
            formData.append('title', title);
            fetch(APPS_SCRIPT_URL, { method: 'POST', body: new URLSearchParams(formData) });
        }

        function renderLogs() {
            const list = document.getElementById('logList');
            list.innerHTML = state.logs.slice().reverse().slice(0, 10).map(log => `
                <div class="bg-white p-5 rounded-[2rem] border border-slate-100 flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center ${getLogColor(log.type)}">
                            <i class="fa-solid ${getLogIcon(log.type)}"></i>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-slate-800">${log.title}</p>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">${log.time}</p>
                        </div>
                    </div>
                    <button onclick="deleteLog('${log.id}')" class="text-slate-200 hover:text-rose-500 p-2"><i class="fa-solid fa-trash-can text-xs"></i></button>
                </div>
            `).join('');
        }

        // Yardımcı Fonksiyonlar
        function getLogIcon(t) { return t === 'sleep' ? 'fa-moon' : t === 'feed' ? 'fa-bottle-droplet' : 'fa-poop'; }
        function getLogColor(t) { return t === 'sleep' ? 'bg-indigo-50 text-indigo-600' : t === 'feed' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'; }
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId + 'Tab').classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-indigo-600', 'text-slate-400'));
            document.querySelector(`[data-target="${tabId}"]`).classList.replace('text-slate-400', 'text-indigo-600');
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function toggleSleep() {
            state.isSleeping ? saveLog('sleep', 'Bebek Uyandı') : saveLog('sleep', 'Bebek Uyudu');
        }

        init();
    </script>
</body>
</html>
